aid: unmind
name: Unmind
description: >-
  Unmind is a workplace mental health platform that supports employees, develops leaders, and
  strengthens organisational performance through therapy, coaching, manager training, crisis care,
  an Employee Assistance Programme (EAP), wellbeing content, insights and assessments, and Nova,
  an AI wellbeing coach. Customers include Uber, MLB, Samsung, British Airways, Diageo, and the
  NHS. Unmind publishes no public developer API; api.unmind.com is a private Apollo GraphQL
  backend serving its own apps.
